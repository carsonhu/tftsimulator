name: Deploy to Droplet

on:
  push:
    branches:
      - fastapi   # or main – whatever branch you want auto-deployed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (not strictly needed, but harmless)
        uses: actions/checkout@v4

      - name: Start SSH agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $USER@$HOST 'bash -s' << "EOF"
          set -e
          /root/tftsimulator/deploy.sh
          EOF