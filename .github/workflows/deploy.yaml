name: Deploy to Droplet

# Push trigger temporarily disabled: a batch of changes is landing on main
# (perf work + bugfixes + a new GitHub Pages workflow) and the push that
# carries them shouldn't also auto-redeploy the droplet in the same motion.
# Re-enable by restoring:
#   on:
#     push:
#       branches:
#         - main
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (not strictly needed, but harmless)
        uses: actions/checkout@v4

      - name: Start SSH agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $USER@$HOST 'bash -s' << "EOF"
          set -e
          bash /root/tftsimulator/deploy.sh
          EOF