name: Deploy the static site to GitHub Pages

# Publishes the whole repo as a static site so index.html (repo root) can
# fetch its sibling .py files (champion.py, sim_entry.py, ...) by relative URL
# at runtime. index.html is the plain HTML/JS build that runs the simulator
# under bare Pyodide; stlite.html is the previous Streamlit-in-the-browser
# build, kept for the pages the new one does not cover yet.
#
# A repo has one Pages site and each deploy replaces all of it, so this one
# build publishes both sites: main (set 18, live) at the root and branch
# set19 under /beta (tftsimulator.app/beta). Every path set19's page loads is
# relative, so it runs from the subfolder unchanged. A push to set19 runs
# set19's beta-deploy.yml, which dispatches this workflow on main, so the
# deploy always runs from main.
#
# This is the only deployment target. The droplet and Ploomber Cloud
# workflows that used to sit beside it are gone; git history has them if a
# server is ever wanted again.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (the live site, served at /)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout set19 (the beta, served at /beta)
        uses: actions/checkout@v4
        with:
          ref: set19
          path: site/beta

      - name: Drop the beta's repo files
        run: rm -rf site/beta/.git site/beta/.github

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
