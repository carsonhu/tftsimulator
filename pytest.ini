[pytest]
# This directory is a package (__init__.py, needed by the set18.* imports in
# compare_champs.py and verify_kaisa.py). Under pytest's default "prepend"
# import mode that makes it put the PARENT folder on sys.path ahead of this
# one, and the parent still holds set-5-era champion.py/status.py/buffs.py --
# so every test here imported the wrong Champion and failed with
# "takes 10 positional arguments but 11 were given".
#
# importlib mode leaves sys.path alone, so conftest.py's entry wins and tests
# import the same modules the app does.
addopts = --import-mode=importlib
testpaths = .

# tests.py has no underscore, so the default test_*.py pattern skipped its 10
# tests entirely. The verify_*.py files are manual scripts, not pytest suites.
python_files = test_*.py tests.py
