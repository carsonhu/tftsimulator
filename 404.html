<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages serves this file for any path that isn't a real file, which is every in-app route: only
      // index.html exists, so every route lands on "/" (set18's Streamlit-only pages are gone in set 19).
      var loc = window.location;
      // Joining zero segments still needs the leading "/": a "//" would be read by location.replace() as
      // protocol-relative and silently fail to navigate.
      loc.replace("/" + (loc.search || "") + loc.hash);
    </script>
  </head>
  <body>Redirecting&hellip;</body>
</html>
